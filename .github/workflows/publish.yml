name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test and build
        run: pnpm check

      - name: Validate release version
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.ref_name }}"

      - name: Pack package
        id: package
        run: |
          PACKAGE_FILE=$(npm pack --silent)
          echo "file=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"

      - name: Publish package
        run: npm publish "${{ steps.package.outputs.file }}" --access public

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" "${{ steps.package.outputs.file }}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
